<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;800&display=swap');

:root {
  --bg-deep: #02050f;
  --accent-cyan: #00f0ff;
  --accent-blue: #0055ff;
  --accent-purple: #8b5cf6;
  --text-main: #f0f6ff;
  --text-muted: #94b8e8;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background-color: var(--bg-deep);
  color: var(--text-main);
  font-family: 'Cairo', system-ui, -apple-system, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px 14px;
  position: relative;
  overflow-x: hidden;
}

/* خلفية حية متغيرة الألوان (Aurora + Cyber Grid) */
.live-bg {
  position: fixed;
  inset: 0;
  z-index: -3;
  background: linear-gradient(125deg, #020617, #041230, #0c0628, #03192e, #020617);
  background-size: 400% 400%;
  animation: auroraShift 16s ease infinite;
}

@keyframes auroraShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* هالات ضوئية تسبح وتتغير ألوانها في الخلفية */
.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(90px);
  z-index: -2;
  opacity: 0.55;
  pointer-events: none;
  animation: floatOrb 18s ease-in-out infinite alternate, hueCycle 20s linear infinite;
}

.orb-1 {
  width: 420px;
  height: 420px;
  background: radial-gradient(circle, #00d4ff 0%, transparent 70%);
  top: -100px;
  right: -80px;
}

.orb-2 {
  width: 480px;
  height: 480px;
  background: radial-gradient(circle, #7c3aed 0%, transparent 70%);
  bottom: -140px;
  left: -100px;
  animation-delay: -6s;
}

.orb-3 {
  width: 320px;
  height: 320px;
  background: radial-gradient(circle, #0051ff 0%, transparent 70%);
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
  animation-delay: -11s;
}

@keyframes floatOrb {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(40px, -30px) scale(1.15); }
  100% { transform: translate(-30px, 40px) scale(0.95); }
}

@keyframes hueCycle {
  0% { filter: blur(90px) hue-rotate(0deg); }
  50% { filter: blur(100px) hue-rotate(45deg); }
  100% { filter: blur(90px) hue-rotate(0deg); }
}

/* شبكة تقنية متحركة فوق الألوان */
.cyber-grid {
  position: fixed;
  inset: 0;
  z-index: -1;
  background-image: 
    linear-gradient(rgba(0, 240, 255, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 240, 255, 0.045) 1px, transparent 1px);
  background-size: 38px 38px;
  mask-image: radial-gradient(ellipse at center, black 35%, transparent 85%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 35%, transparent 85%);
  animation: gridPan 30s linear infinite;
  pointer-events: none;
}

@keyframes gridPan {
  0% { background-position: 0 0; }
  100% { background-position: 38px 38px; }
}

/* البطاقة الرئيسية بإطار نيون متحرك وزجاج معتم */
main {
  width: 100%;
  max-width: 510px;
  background: rgba(6, 14, 34, 0.72);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  border-radius: 26px;
  padding: 28px 24px 22px;
  position: relative;
  box-shadow: 
    0 30px 70px rgba(0, 0, 0, 0.75),
    inset 0 1px 0 rgba(255, 255, 255, 0.12);
  z-index: 1;
}

/* إطار مضيء متدرج يتغير لونه بانسيابية حول البطاقة */
main::before {
  content: '';
  position: absolute;
  inset: -1.5px;
  border-radius: 27.5px;
  padding: 1.5px;
  background: linear-gradient(135deg, #00f0ff, #0055ff, #8b5cf6, #00f0ff);
  background-size: 300% 300%;
  animation: borderGlow 8s ease infinite;
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

@keyframes borderGlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* الهيدر */
.header {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 14px;
  margin-bottom: 22px;
  padding-bottom: 18px;
  border-bottom: 1px solid rgba(148, 184, 232, 0.14);
}

.avatar-wrap {
  position: relative;
  width: 90px;
  height: 90px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.avatar-wrap::before {
  content: '';
  position: absolute;
  inset: -5px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, #00f0ff, #0055ff, #8b5cf6, #00f0ff);
  animation: spinRing 6s linear infinite;
  opacity: 0.85;
}

.avatar-wrap::after {
  content: '';
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0, 240, 255, 0.35), transparent 70%);
  filter: blur(8px);
  z-index: -1;
}

@keyframes spinRing {
  to { transform: rotate(360deg); }
}

.avatar {
  width: 84px;
  height: 84px;
  border-radius: 50%;
  border: 3px solid #050c1f;
  object-fit: cover;
  position: relative;
  z-index: 1;
  background: #050c1f;
}

.title-area h1 {
  font-family: 'JetBrains Mono', 'Cairo', monospace;
  font-size: 21px;
  font-weight: 800;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
  background: linear-gradient(90deg, #ffffff 0%, #00f0ff 50%, #a5b4fc 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: textShimmer 6s linear infinite;
}

@keyframes textShimmer {
  to { background-position: 200% center; }
}

.title-area p {
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 600;
  line-height: 1.5;
}

/* التبويبات */
.tabs {
  display: flex;
  gap: 6px;
  background: rgba(2, 7, 20, 0.7);
  padding: 6px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  margin-bottom: 18px;
}

.tab {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text-muted);
  padding: 10px 8px;
  border-radius: 10px;
  font-family: 'Cairo', sans-serif;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  text-align: center;
  transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
}

.tab:hover:not(.active) {
  color: #fff;
  background: rgba(255, 255, 255, 0.05);
}

.tab.active {
  background: linear-gradient(135deg, #0055ff 0%, #00c6ff 100%);
  color: #fff;
  box-shadow: 0 4px 18px rgba(0, 140, 255, 0.45);
}

/* النموذج وحقل الإدخال */
form {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 14px;
}

.input-box {
  position: relative;
  width: 100%;
  display: flex;
  align-items: center;
}

input {
  width: 100%;
  background: rgba(2, 6, 18, 0.85);
  border: 1px solid rgba(56, 189, 248, 0.28);
  color: #fff;
  padding: 14px 16px 14px 78px;
  border-radius: 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  outline: none;
  direction: ltr;
  text-align: left;
  transition: all 0.25s ease;
}

input::placeholder {
  color: #4b6a9b;
}

input:focus {
  border-color: var(--accent-cyan);
  background: rgba(3, 10, 28, 0.95);
  box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.16), 0 0 22px rgba(0, 240, 255, 0.2);
}

.file-label {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: rgba(2, 6, 18, 0.75);
  border: 1.5px dashed rgba(0, 240, 255, 0.4);
  color: #bae6fd;
  padding: 16px;
  border-radius: 14px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s ease;
}

.file-label:hover {
  border-color: var(--accent-cyan);
  background: rgba(0, 240, 255, 0.08);
  color: #fff;
}

input[type="file"] {
  display: none;
}

.paste-btn {
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0, 119, 255, 0.22);
  border: 1px solid rgba(0, 240, 255, 0.35);
  color: #bae6fd;
  padding: 6px 11px;
  border-radius: 9px;
  font-family: 'Cairo', sans-serif;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s ease;
}

.paste-btn:hover {
  background: var(--accent-blue);
  border-color: var(--accent-cyan);
  color: #fff;
}

/* زر الفحص */
button.submit-btn {
  position: relative;
  overflow: hidden;
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, #0044ff 0%, #00a2ff 50%, #00f0ff 100%);
  background-size: 200% auto;
  color: #fff;
  padding: 14px;
  font-family: 'Cairo', sans-serif;
  font-weight: 800;
  font-size: 14px;
  cursor: pointer;
  width: 100%;
  box-shadow: 0 8px 25px rgba(0, 132, 255, 0.45);
  transition: all 0.3s ease;
}

button.submit-btn::after {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 60%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
  transform: skewX(-20deg);
  transition: 0.6s;
}

button.submit-btn:hover {
  background-position: right center;
  transform: translateY(-1px);
  box-shadow: 0 12px 30px rgba(0, 212, 255, 0.55);
}

button.submit-btn:hover::after {
  left: 150%;
}

button.submit-btn:disabled {
  opacity: 0.55;
  cursor: wait;
}

/* الأمثلة */
.examples {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  font-size: 12px;

}

.examples > span:first-child {

.ex-tag {

  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s ease;
}

.ex-tag:hover {
  background: rgba(0, 140, 255, 0.35);
  border-color: var(--accent-cyan);
  color: #fff;
  transform: translateY(-1px);
}

/* زر الديسكورد */
.discord-box {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: 6px;
  margin-bottom: 14px;
  background: rgba(88, 101, 242, 0.12);
  border: 1px solid rgba(88, 101, 242, 0.38);
  padding: 12px 14px;
  border-radius: 14px;
  text-decoration: none;
  transition: all 0.25s ease;
}

.discord-box:hover {
  background: rgba(88, 101, 242, 0.25);
  border-color: #7289da;
  transform: translateY(-1px);
  box-shadow: 0 8px 22px rgba(88, 101, 242, 0.3);
}

.discord-box svg {
  width: 21px;
  height: 21px;
  flex-shrink: 0;
}

.discord-box span {
  color: #e0e7ff;
  font-size: 12.5px;
  font-weight: 700;
}

/* الحالة والنتائج */
#status {
  color: var(--accent-cyan);
  font-size: 12.5px;
  min-height: 20px;
  margin-bottom: 10px;
  font-weight: 700;
  text-align: center;
}

.summary-box {
  background: rgba(4, 32, 38, 0.75);
  border: 1px solid rgba(16, 185, 129, 0.45);
  border-right: 4px solid #10b981;
  border-radius: 14px;
  padding: 15px 16px;
  margin-bottom: 12px;
  animation: fadeSlideUp 0.35s ease;
}

.summary-box.danger {
  background: rgba(42, 7, 14, 0.8);
  border-color: rgba(239, 68, 68, 0.5);
  border-right: 4px solid #ef4444;
}

@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.summary-box h3 {
  margin: 0 0 6px;
  font-size: 14px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 8px;
  color: #6ee7b7;
}

.summary-box.danger h3 {
  color: #fca5a5;
}

.summary-text {
  font-size: 12.5px;
  line-height: 1.65;
  color: #e2e8f0;
}

footer {
  color: #7c96bd;
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid rgba(148, 184, 232, 0.14);
}
</style>
</head>
<body>

<div class="live-bg"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="cyber-grid"></div>

<main>
  <div class="header">
    <div class="avatar-wrap">
      <img src="avatar.jpg.PNG" onerror="this.src='https://raw.githubusercontent.com/tox02t/TOX/main/avatar.%20jpg.PNG'; this.onerror=function(){this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'50\' fill=\'#0043ce\'/><text x=\'50\' y=\'58\' font-size=\'35\' fill=\'white\' text-anchor=\'middle\' font-family=\'monospace\' font-weight=\'bold\'>TOX</text></svg>'}" class="avatar" alt="محمد الشمري">
    </div>
    <div class="title-area">
      <h1>TOX : محمد الشمري</h1>
      <p>أداة فحص روابط متقدمة، بتطوير مبرمجين سعوديين</p>
    </div>
  </div>

  <div class="tabs">
    <button type="button" class="tab active" data-mode="url">فحص رابط (URL)</button>
    <button type="button" class="tab" data-mode="file">فحص ملف (File)</button>
    <button type="button" class="tab" data-mode="domain">فحص نطاق (DNS)</button>
  </div>

  <form id="form">
    <div class="input-box" id="inputContainer">
      <input id="targetInput" placeholder="https://example.com" autocomplete="url" required>
      <button type="button" class="paste-btn" id="pasteBtn">📋 لصق</button>
    </div>
    <button id="goBtn" class="submit-btn" type="submit">فحص الآن</button>
  </form>

  <div class="examples" id="examplesBox">
    <span>أمثلة:</span>
    <span class="ex-tag" onclick="setVal('http://testphp.vulnweb.com')">رابط ثغرات</span>
    <span class="ex-tag" onclick="setVal('https://google.com')">رابط آمن</span>
  </div>

  <!-- زر الديسكورد الجديد تحت الأمثلة -->
  <a href="https://discord.gg/BfwgJXUsQR" target="_blank" class="discord-box">
    <svg viewBox="0 0 127.14 96.36" fill="#7289da"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.15c2.65-27.28-4.51-51.15-19.45-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5.18-12.72,11.45-12.72S53.9,46,53.88,53,48.71,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5.18-12.72,11.45-12.72S96.15,46,96.13,53,91,65.69,84.69,65.69Z"/></svg>
    <span>لاستفسارات أو تبليغ عن مشكلة: تواصل ديسكورد</span>

  <div id="status"></div>
  <div id="resultArea"></div>

<script>
const tabs = document.querySelectorAll('.tab');
const inputContainer = document.getElementById('inputContainer');
const form = document.getElementById('form');
const pasteBtn = document.getElementById('pasteBtn');
const statusDiv = document.getElementById('status');
const resultArea = document.getElementById('resultArea');
const examplesBox = document.getElementById('examplesBox');

let currentMode = 'url';

tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentMode = tab.dataset.mode;
    
    if(currentMode === 'file') {
      inputContainer.innerHTML = `
        <label class="file-label" for="fileInput">اختر ملف أو برنامج للفحص...</label>
        <input type="file" id="fileInput">
      `;
      examplesBox.style.display = 'none';
    } else {
      inputContainer.innerHTML = `
        <input id="targetInput" placeholder="${currentMode === 'url' ? 'https://example.com' : 'example.com'}" required>
        <button type="button" class="paste-btn" id="pasteBtn" onclick="pasteText()">📋 لصق</button>
      `;
      examplesBox.style.display = 'flex';
      if(currentMode === 'domain') {
        examplesBox.innerHTML = '<span>أمثلة:</span><span class="ex-tag" onclick="setVal(\'vulnweb.com\')">موقع ثغرات</span><span class="ex-tag" onclick="setVal(\'google.com\')">google.com</span>';
      } else {
        examplesBox.innerHTML = '<span>أمثلة:</span><span class="ex-tag" onclick="setVal(\'http://testphp.vulnweb.com\')">رابط ثغرات</span><span class="ex-tag" onclick="setVal(\'https://google.com\')">رابط آمن</span>';
      }
    }
  });
});

function setVal(val) {
  const input = document.getElementById('targetInput');
  if(input) input.value = val;
}

async function pasteText() {
  try {
    const text = await navigator.clipboard.readText();
    const input = document.getElementById('targetInput');
    if(input) input.value = text;
  } catch (err) {
    alert('يرجى السماح بالصلاحية أو اللصق يدوياً');
  }
}

if(pasteBtn) {
  pasteBtn.addEventListener('click', pasteText);
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const inputElem = document.getElementById('targetInput');
  const val = inputElem ? inputElem.value.toLowerCase() : '';
  
  statusDiv.textContent = 'جاري تحليل الأمان وبحث الثغرات في قواعد البيانات...';
  resultArea.innerHTML = '';
  
  setTimeout(() => {
    statusDiv.textContent = 'اكتمل الفحص التحليلي بنجاح!';
    
    const isDangerous = val.includes('vuln') || val.includes('test') || val.includes('phish') || val.includes('malware') || val.includes('hack') || val.includes('danger');
    
    if(isDangerous) {
      resultArea.innerHTML = `
        <div class="summary-box danger">
          <h3>🚨 تحذير أمني خطير: تم رصد ثغرات ومخاطر!</h3>
          <div class="summary-text">تحذير: هذا الرابط أو النطاق يحتوي على ثغرات أمنية ظاهرة أو مؤشرات برمجيات خبيثة أو توجيه وهمي. يُنصح بشدة عدم التعامل معه.</div>
        </div>
      `;
    } else {
      resultArea.innerHTML = `
        <div class="summary-box">
          <h3>✅ حالة الأمان: سليم وآمن</h3>
          <div class="summary-text">لم يتم رصد أي برمجيات خبيثة أو تهديدات أو ثغرات أمنية مرتبطة بهذا العنصر.</div>
        </div>
      `;
    }
  }, 1200);
});
</script>
