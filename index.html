
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOX WiFi Security</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#080a0f;color:white;
font-family:Arial,sans-serif;
min-height:100vh;display:flex;
justify-content:center;align-items:center;padding:20px
}
.container{
width:100%;max-width:440px;padding:25px;
background:#11151e;border:1px solid #293244;
border-radius:18px;box-shadow:0 0 35px #000
}
.logo{text-align:center;font-size:42px;
font-weight:bold;letter-spacing:7px}
.sub{text-align:center;color:#8995a8;margin:8px 0 25px}
h3{font-size:15px;color:#dce3ed}
input{
width:100%;padding:14px;margin:8px 0;
background:#080c14;color:white;
border:1px solid #30394b;border-radius:9px;
outline:none
}
button{
width:100%;padding:14px;margin-top:10px;
border:0;border-radius:9px;background:#e5e7eb;
color:#080a0f;font-weight:bold;cursor:pointer
}
.result{
margin-top:18px;padding:15px;
background:#080c14;border:1px solid #30394b;
border-radius:10px;overflow-wrap:anywhere
}
small{color:#8995a8}
#strength{margin-top:12px;color:#aab5c5}
.footer{text-align:center;margin-top:25px}
</style>
</head>
<body>
<div class="container">
<div class="logo">TOX</div>
<div class="sub">WIFI SECURITY LAB</div>

<h3>توليد كلمة مرور</h3>
<input id="length" type="number" min="8" max="32" value="16">
<button onclick="generate()">توليد باسورد</button>

<div class="result">
<small>كلمة المرور</small>
<h3 id="generated">TOX-********</h3>
<button onclick="copyPassword()">نسخ الباسورد</button>
</div>

<h3>فحص قوة الباسورد</h3>
<input id="password" type="text"
placeholder="اكتب كلمة المرور"
oninput="checkStrength()">
<div id="strength">بانتظار كلمة المرور...</div>

<div class="footer">
<small>TOX SECURITY LAB © 2026</small>
</div>
</div>

<script>
function generate(){
const length=Math.max(8,Math.min(32,
Number(document.getElementById("length").value)||16));
const chars="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*";
const random=new Uint32Array(length);
crypto.getRandomValues(random);
let password="";
for(const n of random)password+=chars[n%chars.length];
document.getElementById("generated").textContent=password;
}

function copyPassword(){
const p=document.getElementById("generated").textContent;
navigator.clipboard.writeText(p)
.then(()=>alert("تم النسخ"));
}

function checkStrength(){
const p=document.getElementById("password").value;
let s=0;
if(p.length>=8)s++;
if(p.length>=12)s++;
if(/[A-Z]/.test(p))s++;
if(/[a-z]/.test(p))s++;
if(/[0-9]/.test(p))s++;
if(/[^a-zA-Z0-9]/.test(p))s++;
const levels=["ضعيفة جداً","ضعيفة","متوسطة","جيدة","قوية","قوية جداً","ممتازة"];
document.getElementById("strength").textContent=
p.length?"قوة كلمة المرور: "+levels[s]:"بانتظار كلمة المرور...";
}
</script>
</body>
</html>
