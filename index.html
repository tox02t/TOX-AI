<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOX AI : محمد الشمري | المساعد الذكي الموسع</title>

<style>
:root{--bg-base:#030712;--bg-card:#0b1329;--border-color:#1e3a8a;--accent-glow:#00d4ff;--text-main:#e2ecff;--text-sub:#8ab4f8}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg-base);color:var(--text-main);font-family:system-ui,-apple-system,sans-serif;display:flex;justify-content:center;align-items:center;padding:10px}
main{width:100%;max-width:540px;background:var(--bg-card);border:1px solid var(--border-color);border-radius:20px;padding:16px;box-shadow:0 25px 60px rgba(0,102,255,0.25);display:flex;flex-direction:column;height:92vh}

.header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #152d56;padding-bottom:12px;margin-bottom:12px;flex-shrink:0}
.title-area h1{color:var(--accent-glow);font-size:18px;font-weight:900;letter-spacing:.5px}
.title-area p{color:var(--text-sub);font-size:11px;margin-top:2px;font-weight:600}
.status-badge{background:#052248;border:1px solid #00d4ff;color:#00d4ff;font-size:10px;padding:4px 8px;border-radius:20px;display:flex;align-items:center;gap:5px}
.status-dot{width:6px;height:6px;background:#00d4ff;border-radius:50%;box-shadow:0 0 8px #00d4ff}

#chatContainer{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;margin-bottom:12px;padding:6px;scroll-behavior:smooth}
.message{padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.7;max-width:88%;word-break:break-word;box-shadow:0 4px 15px rgba(0,0,0,0.2)}
.message.user{background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.message.ai{background:#06112a;border:1px solid #1d4ed8;color:#f1f5f9;align-self:flex-start;border-bottom-left-radius:4px}

.examples{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;font-size:11px;align-items:center;flex-shrink:0}
.ex-tag{background:#081b3d;border:1px solid #1e3a8a;color:#93c5fd;padding:5px 10px;border-radius:8px;cursor:pointer;transition:.2s}
.ex-tag:hover{background:#1d4ed8;color:#fff;border-color:#00d4ff}

form{display:flex;gap:8px;flex-shrink:0;background:#020614;border:1px solid #1d4ed8;border-radius:14px;padding:6px;box-shadow:0 0 15px rgba(29,78,216,0.15)}
input{flex:1;background:transparent;border:0;color:#fff;padding:8px 10px;font-size:13px;outline:none;text-align:right}
input::placeholder{color:#64748b}
button.submit-btn{border:0;border-radius:10px;background:linear-gradient(135deg,#0052D4,#4364F7);color:#fff;padding:0 18px;font-weight:bold;cursor:pointer;font-size:13px;box-shadow:0 4px 12px rgba(0,82,212,0.4);transition:.2s}
button.submit-btn:hover{opacity:.9;transform:scale(1.02)}

footer{color:#64748b;text-align:center;font:10px monospace;padding-top:8px;border-top:1px solid #112240;flex-shrink:0;margin-top:auto}
</style>
</head>
<body>
<main>
  <div class="header">
    <div class="title-area">
      <h1>TOX AI 🤖</h1>
      <p>المساعد الذكي الموسع - بإشراف محمد الشمري</p>
    </div>
    <div class="status-badge">
      <div class="status-dot"></div>
      قاعدة معرفة موسعة
    </div>
  </div>

  <div id="chatContainer">
    <div class="message ai">أهلاً بك يا أسطورة! أنا **TOX AI** بقاعدتي الموسعة بالكامل. اسألني عن الفضاء، التاريخ، البرمجة، العلوم، أو أي استفسار خطر على بالك وسأجيبك فوراً! 🚀</div>
  </div>

  <div class="examples" id="examplesBox">
    <span style="color:#64748b">جرب:</span>
    <span class="ex-tag" onclick="sendDirect('حدثني عن تاريخ الذكاء الاصطناعي')">تاريخ AI</span>
    <span class="ex-tag" onclick="sendDirect('عطني نصائح لتطوير الذات والإنتاجية')">تطوير الذات</span>
    <span class="ex-tag" onclick="sendDirect('كيف تعمل الثقوب السوداء في الفضاء؟')">الفضاء</span>
  </div>

  <form id="chatForm" onsubmit="handleFormSubmit(event)">
    <input id="targetInput" placeholder="اسأل عن أي شيء في الكون..." autocomplete="off">
    <button id="goBtn" class="submit-btn" type="submit">إرسال</button>
  </form>

  <footer>
    TOX AI Platform &copy; 2026 - Mohammed Al-Shammari
  </footer>
</main>

<script>
const chatContainer = document.getElementById('chatContainer');
const targetInput = document.getElementById('targetInput');

function sendDirect(text) {
  targetInput.value = text;
  processMessage();
}

function handleFormSubmit(event) {
  event.preventDefault();
  processMessage();
}

function processMessage() {
  const query = targetInput.value.trim();
  if (!query) return;

  appendMessage(query, 'user');
  targetInput.value = '';

  const loadId = 'load-' + Date.now();
  appendMessage('<span style="display:flex; align-items:center; gap:6px;">🌌 جاري البحث في قاعدة المعرفة الشاملة...</span>', 'ai', loadId);

  setTimeout(() => {
    const loadingElement = document.getElementById(loadId);
    if (loadingElement) loadingElement.remove();
    
    const reply = generateMegaReply(query);
    appendMessage(reply, 'ai');
  }, 900);
}

function appendMessage(text, sender, customId = null) {
  const msgDiv = document.createElement('div');
  msgDiv.className = `message ${sender}`;
  if (customId) {
    msgDiv.id = customId;
    msgDiv.style.opacity = '0.75';
    msgDiv.innerHTML = text;
  } else {
    msgDiv.innerHTML = text.replace(/\n/g, '<br>');
  }
  chatContainer.appendChild(msgDiv);
  chatContainer.scrollTop = chatContainer.scrollHeight;
  return customId;
}

function generateMegaReply(query) {
  const q = query.toLowerCase();

  if (q.includes('فضاء') || q.includes('نجوم') || q.includes('كواكب') || q.includes('ثقب') || q.includes('مجرة')) {
    return `🌌 **استكشاف الفضاء مع TOX AI:**\nالكون مليء بالأسرار العظيمة! فيما يخص ("${query}")، الفضاء الخارجي يحتوي على مليارات المجرات والثقوب السوداء التي تحني الزمن والجاذبية. هل ترغب في معرفة المزيد عن ظاهرة كونية معينة أو رحلات استكشاف الفضاء؟`;
  }
  else if (q.includes('تاريخ') || q.includes('زمان') || q.includes('قصة') || q.includes('حرب') || q.includes('ماضي')) {
    return `📜 **الأرشيف التاريخي من TOX AI:**\nالتاريخ هو مرآة الشعوب! استفسارك عن ("${query}") يعكس أهمية الأحداث الكبرى التي صاغت حاضرنا اليوم. هل تحب أن نستعرض تفاصيل حقبة تاريخية معينة أو شخصية أثرت في التاريخ؟`;
  }
  else if (q.includes('تطوير') || q.includes('نجاح') || q.includes('مهارات') || q.includes('إدارة') || q.includes('وقت')) {
    return `🎯 **دليل الإنتاجية وتطوير الذات:**\nالوصول للقمة يتطلب استراتيجية وعمل مستمر. بخصوص ("${query}")، أهم مفاتيح النجاح هي التركيز العالي، تجنب التسويف، وتنظيم المهام بذكاء. هل تحتاج لخطط تنظيم يومية أو نصائح قيادية؟`;
  }
  else if (q.includes('برمجة') || q.includes('كود') || q.includes('تطوير') || q.includes('بايثون') || q.includes('موقع')) {
    return `💻 **القسم التقني الموسع:**\nالبرمجة هي أداة المستقبل وصناعة الحلول! حول ("${query}")، تذكر دائماً أن التخطيط لهيكل الكود قبل كتابته يوفر 50% من الوقت. هل تحتاج إلى سكريبت برمجي أو فكرة خوارزمية لأكتبها لك فوراً؟`;
  }
  else if (q.includes('رياضة') || q.includes('لياقة') || q.includes('صحة') || q.includes('تغذية')) {
    return `💪 **الصحة واللياقة مع TOX AI:**\nالعقل السليم في الجسم السليم! بالنسبة لـ ("${query}")، الالتزام بنظام غذائي متوازن وممارسة الرياضة بانتظام يصنعان الفارق الكبير في طاقتك اليومية. هل تحتاج لنصائح تخص التمارين أو الغذاء الصحي؟`;
  }
  else {
    return `🚀 **تحليل موسع من TOX AI:**\nلقد استقبلت سؤالك المميز: *"${query}"*.\nبناءً على قاعدة المعرفة الشاملة، هذا الموضوع يرتبط بعوامل متعددة تساهم في تقديم رؤية عميقة وحلول مبتكرة. هل ترغب بأن نتعمق في نقطة محددة داخل هذا الموضوع لنطورها بشكل احترافي؟`;
  }
}
</script>
</body>
</html>
