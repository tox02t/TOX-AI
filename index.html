
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOX WiFi Tool</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080a0f;color:white;
 font-family:Arial,sans-serif;
 display:flex;justify-content:center;
 align-items:center;min-height:100vh;
}
.container{
 width:92%;max-width:430px;
 background:#11151e;border:1px solid #252d3b;
 border-radius:18px;padding:25px;
 box-shadow:0 0 35px #000;
}
.logo{text-align:center;font-size:35px;
 font-weight:bold;color:#e0e0e0;letter-spacing:5px}
.sub{text-align:center;color:#7e899b;margin:8px 0 25px}
h3{font-size:16px;color:#cbd5e1}
input{
 width:100%;padding:15px;background:#080c14;
 border:1px solid #30394b;border-radius:9px;
 color:white;font-size:15px;outline:none;
 margin:8px 0;
}
button{
 width:100%;padding:14px;border:0;
 border-radius:9px;background:#e5e7eb;
 color:#080a0f;font-weight:bold;
 cursor:pointer;margin-top:10px;font-size:15px;
}
button:hover{background:#aaa}
.result{
 margin-top:18px;padding:15px;
 background:#080c14;border-radius:9px;
 border:1px solid #30394b;overflow-wrap:anywhere;
}
small{color:#8995a8}
#strength{margin-top:10px;color:#9ca3af}
</style>
</head>
<body>
<div class="container">
 <div class="logo">TOX</div>
 <div class="sub">WIFI PASSWORD LAB</div>

 <h3>توليد كلمة مرور آمنة</h3>
 <input id="length" type="number" min="8" max="32"
 value="16" placeholder="طول كلمة المرور">
 <button onclick="generate()">توليد كلمة مرور</button>

 <div class="result">
  <small>كلمة المرور الناتجة</small>
  <h3 id="generated">TOX-********</h3>
  <button onclick="copyPassword()">نسخ كلمة المرور</button>
 </div>

 <h3>فحص قوة كلمة المرور</h3>
 <input id="password" type="text"
 placeholder="أدخل كلمة المرور للفحص"
 oninput="checkStrength()">
 <div id="strength">بانتظار كلمة المرور...</div>

 <div style="text-align:center;margin-top:25px">
  <small>TOX SECURITY LAB © 2026</small>
 </div>
</div>

<script>
function generate(){
 const length=Math.min(32,Math.max(8,
 Number(document.getElementById("length").value)||16));
 const chars="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*";
 let password="";
 const random=new Uint32Array(length);
 crypto.getRandomValues(random);
 for(let n of random){
  password+=chars[n%chars.length];
 }
 document.getElementById("generated").textContent=password;
}

function copyPassword(){
 const password=document.getElementById("generated").textContent;
 navigator.clipboard.writeText(password);
 alert("تم نسخ كلمة المرور");
}

function checkStrength(){
 const p=document.getElementById("password").value;
 let score=0;
 if(p.length>=8)score++;
 if(p.length>=12)score++;
 if(/[A-Z]/.test(p))score++;
 if(/[a-z]/.test(p))score++;
 if(/[0-9]/.test(p))score++;
 if(/[^a-zA-Z0-9]/.test(p))score++;

 const result=document.getElementById("strength");
 const levels=["ضعيفة جداً","ضعيفة","متوسطة","جيدة","قوية","قوية جداً","ممتازة"];
 result.textContent=p.length ? "قوة كلمة المرور: "+levels[score] : "بانتظار كلمة المرور...";
}
</script>
</body>
</html>
