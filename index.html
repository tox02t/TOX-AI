<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>فحص الجوال الشامل</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        h1 { font-size: 1.4rem; margin-bottom: 5px; }
        .card {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            background: #3b82f6;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { opacity: 0.8; }
        .btn-group { display: flex; gap: 8px; }
        
        /* شاشة فحص الألوان */
        #screen-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        
        /* لوحة فحص اللمس */
        canvas {
            background: #020617;
            border: 1px dashed #475569;
            border-radius: 8px;
            width: 100%;
            height: 200px;
            touch-action: none; /* يمنع تمرير الصفحة أثناء الرسم */
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>أداة فحص هاردوير الجوال</h1>

    <!-- 1. فحص الشاشة -->
    <div class="card">
        <h3>1. فحص الشاشة (البكسلات)</h3>
        <p style="font-size: 0.85rem; color: #94a3b8;">المس الشاشة للتنقل بين الألوان واكتشاف أي نقاط ميتة.</p>
        <button onclick="startScreenTest()">بدء فحص الألوان</button>
    </div>

    <!-- 2. فحص السماعات -->
    <div class="card">
        <h3>2. فحص السماعات (ستيريو)</h3>
        <p style="font-size: 0.85rem; color: #94a3b8;">اختبر نقاء الصوت وتوزيعه بين السماعة العلوية والسفلية.</p>
        <div class="btn-group">
            <button onclick="playTone(-1)" style="background: #10b981;">سماعة يسار / علوية</button>
            <button onclick="playTone(1)" style="background: #8b5cf6;">سماعة يمين / سفلية</button>
        </div>
    </div>

    <!-- 3. فحص اللمس -->
    <div class="card">
        <h3>3. فحص استجابة اللمس</h3>
        <p style="font-size: 0.85rem; color: #94a3b8;">مرر إصبعك داخل المربع للتأكد من سلاسة التتبع.</p>
        <canvas id="touchCanvas"></canvas>
        <button onclick="clearCanvas()" style="background: #475569;">مسح الرسم</button>
    </div>

    <!-- طبقة فحص الشاشة الكاملة -->
    <div id="screen-overlay" onclick="nextColor()">المس الشاشة لتغيير اللون</div>

    <script>
        // --- 1. برمجة فحص الشاشة ---
        const colors = ['#FF0000', '#00FF00', '#0000FF', '#FFFFFF', '#000000'];
        let colorIndex = 0;
        const overlay = document.getElementById('screen-overlay');

        function startScreenTest() {
            colorIndex = 0;
            overlay.style.display = 'flex';
            overlay.style.backgroundColor = colors[colorIndex];
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }

        function nextColor() {
            colorIndex++;
            if (colorIndex >= colors.length) {
                overlay.style.display = 'none';
                if (document.exitFullscreen && document.fullscreenElement) {
                    document.exitFullscreen().catch(() => {});
                }
            } else {
                overlay.style.backgroundColor = colors[colorIndex];
                overlay.textContent = ''; // إخفاء النص لصفاء الشاشة
            }
        }

        // --- 2. برمجة فحص السماعات (Web Audio API) ---
        function playTone(panValue) {
            // إنشاء سياق الصوت في المتصفح
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioContext();
            
            // توليد موجة صوتية بتردد 440 هرتز (نغمة صافية)
            const oscillator = ctx.createOscillator();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(440, ctx.currentTime);

            // التحكم في اتجاه الصوت (يمين = 1، يسار = -1)
            const panner = ctx.createStereoPanner();
            panner.pan.setValueAtTime(panValue, ctx.currentTime);

            // ربط الصوت بالمخرج وتشغيله لمدة ثانية واحدة
            oscillator.connect(panner);
            panner.connect(ctx.destination);
            
            oscillator.start();
            oscillator.stop(ctx.currentTime + 1);
        }

        // --- 3. برمجة فحص اللمس (Canvas API) ---
        const canvas = document.getElementById('touchCanvas');
        const ctx2d = canvas.getContext('2d');
        let isDrawing = false;

        // ضبط دقة الرسم لتطابق أبعاد العنصر
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        ctx2d.strokeStyle = '#38bdf8';
        ctx2d.lineWidth = 4;
        ctx2d.lineCap = 'round';

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches ? e.touches[0] : e;
            return {
                x: touch.clientX - rect.left,
                y: touch.clientY - rect.top
            };
        }

        canvas.addEventListener('touchstart', (e) => {
            isDrawing = true;
            const pos = getPos(e);
            ctx2d.beginPath();
            ctx2d.moveTo(pos.x, pos.y);
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDrawing) return;
            const pos = getPos(e);
            ctx2d.lineTo(pos.x, pos.y);
            ctx2d.stroke();
        });

        canvas.addEventListener('touchend', () => isDrawing = false);

        function clearCanvas() {
            ctx2d.clearRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</body>
</html>
