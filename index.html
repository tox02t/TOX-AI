.discord-box span{color:#93c5fd;font-size:11px;font-weight:bold}

footer{color:#64748b;text-align:center;font:10px monospace;padding-top:8px;border-top:1px solid #112240;flex-shrink:0}

<main>

      <p>المساعد الذكي المتطور بتطوير محمد الشمري</p>
    </div>
  </div>

  <div id="chatContainer">
    <div class="message ai">أهلاً بك يا أسطورة! أنا **TOX AI**، مساعدك الذكي الخاص. اسألني عن أي شيء (برمجة، تقنية، أمان، أو استفسارات عامة) وسأجيبك فوراً! 🚀</div>
  </div>

  <form id="form">
    <input id="targetInput" placeholder="اكتب سؤالك هنا..." autocomplete="off" required>
    <button id="goBtn" class="submit-btn" type="submit">إرسال</button>
  </form>

  <div class="examples" id="examplesBox">
    <span>أمثلة:</span>
    <span class="ex-tag" onclick="setVal('كيف أحمي جهازي من الاختراق؟')">نصيحة أمنية</span>
    <span class="ex-tag" onclick="setVal('اكتب لي كود بايثون بسيط')">برمجة</span>
    <span class="ex-tag" onclick="setVal('من أنت؟')">من أنت؟</span>
  </div>

</main>

<script>
const chatContainer = document.getElementById('chatContainer');
const form = document.getElementById('form');
const targetInput = document.getElementById('targetInput');

function setVal(val) {
  targetInput.value = val;
}

form.append('submit', ...); // handled below
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const val = targetInput.value.trim();
  if(!val) return;

  appendMessage(val, 'user');
  targetInput.value = '';

  appendMessage('جاري التفكير...', 'ai');
  
  setTimeout(() => {
    chatContainer.lastChild.remove();
    let aiReply = generateSmartReply(val);
    appendMessage(aiReply, 'ai');
  }, 1000);
});

function appendMessage(text, sender) {
  const msgDiv = document.createElement('div');
  msgDiv.className = `message ${sender}`;
  msgDiv.innerHTML = text.replace(/\n/g, '<br>');
  chatContainer.appendChild(msgDiv);
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

function generateSmartReply(query) {
  q = query.toLowerCase();
  if(q.includes('اختراق') || q.includes('حماية') || q.includes('أمان')) {
    return '🔒 **نصائح أمنية من TOX AI:**\n1. لا تضغط على روابط مجهولة.\n2. فعّل التحقق بخطوتين (2FA) على حساباتك.\n3. حدث أنظمتك دائماً لإغلاق الثغرات.';
  } else if(q.includes('برمجة') || q.includes('كود') || q.includes('بايثون')) {
    return '💻 **مساعد البرمجة:** البرمجة ممتعة وتحتاج استمرارية! هل تبحث عن لغة معينة (مثل Python أو JavaScript) لتطوير مشروعك القادم؟ أخبرني بالتفاصيل لأكتب لك الكود المطلوب.';
  } else if(q.includes('من أنت') || q.includes('مين انت') || q.includes('اسمك')) {
    return '🤖 أنا **TOX AI**، مساعدك الذكي الخاص المطور بواسطة **محمد الشمري** لمساعدتك في الإجابة على الأسئلة التقنية وتسهيل مهامك.';
  } else {
    return `💡 استفسارك عن: "${query}"\nأنا هنا لمساعدتك كـ **TOX AI**! إذا كنت تحتاج تفاصيل أعمق حول هذا الموضوع أو فكرة مشروع جديدة، عطني خبر لنتناقش فيها فوراً!`;
  }
}
</script>
